<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Wordit</title>
    <link rel="icon" type="image/x-icon" href="/static/logo.png">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
    <div class="logo">
        <img src="static/logo.png" alt="Wordit Logo"/> 
        <h2>Arcadely</h2>
    </div>
    
    <h1>Wordit</h1>
</header>
<div class="content">
    <div class="player">
        <div id="login">
            <input id="username" placeholder="Enter your name" />
            <div class="btns">
                <button id="loginBtn">Login</button>
                <button id="createBtn">Create Account</button>
            </div>
        </div>
        <div class="error-div">
            <p id="error" class="error"></p>
        </div>
        <div id="player-info" style="display:none;">
            <div id="player-name"></div>
            <button onclick="logout()">Logout</button>
        </div>

        
        <!-- results panel -->
        <div id="results" class="results">
            <h2 id="result-msg"></h2>
            <p>Total solved: <span id="res-total"></span></p>
            <p>Current streak: <span id="res-streak"></span></p>


            <div id="dist-histogram" class="histogram">
                <div class="hist-row">
                    <div class="hist-label">1</div>
                    <div class="hist-bar"><div class="hist-fill" id="bar1"><span class="bar-count" id="d1">0</span></div></div>
                </div>
                <div class="hist-row">
                    <div class="hist-label">2</div>
                    <div class="hist-bar"><div class="hist-fill" id="bar2"><span class="bar-count" id="d2">0</span></div></div>
                </div>
                <div class="hist-row">
                    <div class="hist-label">3</div>
                    <div class="hist-bar"><div class="hist-fill" id="bar3"><span class="bar-count" id="d3">0</span></div></div>
                </div>
                <div class="hist-row">
                    <div class="hist-label">4</div>
                    <div class="hist-bar"><div class="hist-fill" id="bar4"><span class="bar-count" id="d4">0</span></div></div>
                </div>
                <div class="hist-row">
                    <div class="hist-label">5</div>
                    <div class="hist-bar"><div class="hist-fill" id="bar5"><span class="bar-count" id="d5">0</span></div></div>
                </div>
            </div>
        </div>
        <div id="output" style="display: none">
            <p><strong>The correct word was:</strong> <span id="correct-word"></span></p>
            <div class="nxt">
                <button id="nextBtn">Next</button>
            </div>
        </div>

    </div>
    <div class="game">
        <div id="grid" aria-label="Wordle grid"></div>

        <!-- On-screen keyboard -->
        <div id="keyboard" aria-label="On-screen keyboard"></div>
    </div>
</div>


<script src="/static/script.js"></script>
</body>
</html>
